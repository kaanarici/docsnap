name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: [1.3.14, canary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun ci
      - run: bun run check
      - run: bun run publish:dry
      - name: Smoke packed CLI
        run: |
          ARCHIVE_DIR=$(mktemp -d)
          INSTALL_DIR=$(mktemp -d)
          ARCHIVE="$ARCHIVE_DIR/docsnap.tgz"
          bun pm pack --filename "$ARCHIVE" --quiet
          cd "$INSTALL_DIR"
          bun add "$ARCHIVE"
          ./node_modules/.bin/docsnap --version
          ./node_modules/.bin/docsnap --help >/dev/null
