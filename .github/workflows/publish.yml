name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun ci
      - run: bun run check
      - run: bun run publish:dry
      - name: Verify release identity
        id: package
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          MAIN_SHA=$(git rev-parse origin/main)
          test "$GITHUB_SHA" = "$MAIN_SHA" || {
            echo "Release tag must point at the current origin/main commit $MAIN_SHA"
            exit 1
          }
          NAME=$(bun -e 'const p = await Bun.file("package.json").json(); console.log(p.name)')
          VERSION=$(bun -e 'const p = await Bun.file("package.json").json(); console.log(p.version)')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          test "$TAG_VERSION" = "$VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check package version
        id: npm
        run: |
          NAME="${{ steps.package.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already exists on npm"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require npm publishing credentials
        if: steps.npm.outputs.exists == 'false'
        run: test -n "$NPM_CONFIG_TOKEN" || { echo "Repository secret NPM_TOKEN is not configured"; exit 1; }
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --dry-run
        if: steps.npm.outputs.exists == 'false'
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish
        if: steps.npm.outputs.exists == 'false'
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm publication
        run: |
          NAME="${{ steps.package.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"
          for _ in 1 2 3 4 5 6; do
            PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
            LATEST=$(npm view "$NAME" dist-tags.latest 2>/dev/null || true)
            GIT_HEAD=$(npm view "$NAME@$VERSION" gitHead 2>/dev/null || true)
            if test "$PUBLISHED" = "$VERSION" && \
              test "$LATEST" = "$VERSION" && \
              test "$GIT_HEAD" = "$GITHUB_SHA"; then
              exit 0
            fi
            sleep 10
          done
          echo "npm identity mismatch: version=$PUBLISHED latest=$LATEST gitHead=$GIT_HEAD expected=$GITHUB_SHA"
          exit 1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --latest \
              --title "docsnap ${{ needs.publish.outputs.version }}" \
              --generate-notes
          STATE=$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft,isPrerelease,publishedAt \
            --jq '[.isDraft,.isPrerelease,(.publishedAt != null)] | @tsv')
          test "$STATE" = $'false\tfalse\ttrue' || {
            echo "GitHub release must be published and non-prerelease"
            exit 1
          }
          LATEST=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          test "$LATEST" = "$GITHUB_REF_NAME" || {
            echo "GitHub latest release is $LATEST, expected $GITHUB_REF_NAME"
            exit 1
          }
